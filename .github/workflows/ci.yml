name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one CI run per ref at a time; cancel stale runs to free runners + caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native lib (cargo-ndk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Android SDK (cmdline tools, licenses accepted)
        uses: android-actions/setup-android@v4

      - name: Install NDK + platform/build-tools
        run: |
          sdkmanager --install "ndk;27.0.12077973" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Cache the Rust build dir. Key includes Cargo.lock so a core-rev bump
      # (the only thing that changes the lock) invalidates it automatically.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: android/rust

      - name: Build .so (arm64-v8a + x86_64, release)
        working-directory: android
        run: ./scripts/build-native.sh release

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs
          if-no-files-found: error

  apk:
    name: APK + unit tests
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (cmdline tools, licenses accepted)
        uses: android-actions/setup-android@v4

      - name: Install platform + build-tools
        run: |
          sdkmanager --install "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Prune files in the cache that this build didn't use, keeping it small.
          gradle-home-cache-cleanup: true

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs

      - name: Build debug APK + run JVM unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: strym-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Keep the repo's cache from growing unbounded: delete every cache
      # entry except the freshest few created by this run.
      - name: Prune stale caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP=4
          gh api repos/${{ github.repository }}/actions/caches --paginate \
            -q '.actions_caches | sort_by(.created_at) | reverse | .['"$KEEP"':][] | .id' \
            | while read -r id; do
                echo "deleting stale cache $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" > /dev/null
              done
